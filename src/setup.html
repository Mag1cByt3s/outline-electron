<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Outline - Setup</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p {
      color: #aaa;
      margin-bottom: 32px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #16162a;
      color: #fff;
      margin-bottom: 16px;
      outline: none;
    }
    input:focus {
      border-color: #5c6bc0;
    }
    input::placeholder {
      color: #666;
    }
    button {
      width: 100%;
      padding: 12px 24px;
      font-size: 16px;
      background: #5c6bc0;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #7986cb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Outline</h1>
    <p>Enter your Outline instance URL to get started</p>
    <form id="setup-form">
      <input
        type="text"
        id="url-input"
        placeholder="https://docs.example.com"
        autofocus
        required
      >
      <button type="submit">Connect</button>
    </form>
  </div>
  <script>
    document.getElementById('setup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('url-input').value.trim();
      if (url) {
        window.electronAPI.setInstanceUrl(url);
      }
    });
  </script>
</body>
</html>
